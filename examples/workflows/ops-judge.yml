# Copy to .github/workflows/ops-judge.yml in the repository you want triaged.
name: ops-judge

on:
  workflow_run:
    workflows: [CI]          # the workflow(s) to watch
    types: [completed]

permissions:
  actions: write             # rerun failed jobs
  pull-requests: write       # explain the call on the PR
  issues: write
  contents: read

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: KJLavender/ops-judge@main
        with:
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # optional: `claude setup-token`
          # typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          # notify-webhook: ${{ secrets.SLACK_WEBHOOK }}
