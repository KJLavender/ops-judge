<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ops-judge · CI failure triage on real GitHub Actions data</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3f0; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #dcdad5;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --series-1: #2a78d6; --series-1-soft: #cde2fb; --baseline: #a8a7a2;
    --good: #0ca30c; --critical: #d03b3b; --warning: #fab219;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #262624; --border: #383835;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --series-1: #3987e5; --series-1-soft: #184f95; --baseline: #5c5b57;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #262624; --border: #383835;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --series-1-soft: #184f95; --baseline: #5c5b57;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 19px; margin: 40px 0 12px; }
  h3 { font-size: 15px; margin: 18px 0 8px; color: var(--text-secondary); font-weight: 600; }
  p.lead { font-size: 17px; color: var(--text-secondary); margin: 0; max-width: 760px; }
  .toggles { display: flex; gap: 6px; }
  button.tg { background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--border);
              border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button.tg[aria-pressed="true"] { color: var(--text-primary); border-color: var(--text-secondary); }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 22px; }
  .tile .v { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--text-secondary); font-size: 13px; }
  .pipeline { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .stage { flex: 1 1 100px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .stage b { display: block; font-size: 14px; margin-bottom: 2px; }
  .arrow { align-self: center; color: var(--text-muted); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 13px; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .muted { color: var(--text-muted); }
  .barcell { width: 34%; }
  .hbar { position: relative; height: 14px; }
  .hbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--series-1); }
  .hbar .fill.base { background: var(--baseline); }
  .hbar .chance { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed var(--text-muted); }
  .explorer { display: grid; grid-template-columns: 330px 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .explorer { grid-template-columns: 1fr; } }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .filters input { flex: 1 1 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
                   background: var(--surface-1); color: var(--text-primary); font: inherit; font-size: 14px; }
  .list { max-height: 720px; overflow: auto; padding: 0; }
  .item { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
  .item:hover { background: var(--surface-2); }
  .item[aria-selected="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--series-1); }
  .item .err { font-family: var(--mono); font-size: 12px; color: var(--text-secondary);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 7px; border-radius: 99px;
           border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
  .ok .dot { background: var(--good); } .bad .dot { background: var(--critical); } .wait .dot { background: var(--warning); }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  dl.facts dt { color: var(--text-secondary); }
  dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }
  pre { background: var(--surface-2); border-radius: 8px; padding: 12px; font: 12px/1.45 var(--mono);
        overflow: auto; max-height: 360px; white-space: pre; }
  details summary { cursor: pointer; color: var(--text-secondary); font-size: 14px; }
  .models { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .model { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
  .model .name { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .prow { display: grid; grid-template-columns: 96px 1fr 38px; gap: 6px; align-items: center; font-size: 12px; height: 20px; }
  .prow .lab { color: var(--text-secondary); white-space: nowrap; }
  .prow .lab.tr::after { content: " ↻"; color: var(--text-muted); }
  .prow .track { height: 10px; position: relative; }
  .prow .track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .prow .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
  .step { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--surface-1); }
  .step .t { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
  .step.acc { border-color: var(--series-1); }
  .verdict { margin-top: 12px; font-size: 15px; }
  .expgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .expgrid h3 { margin-top: 0; color: var(--text-primary); }
  .expgrid p { font-size: 13px; color: var(--text-secondary); margin: 4px 0 10px; }
  #tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
         border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; z-index: 9; }
  ul.notes { padding-left: 20px; } ul.notes li { margin: 4px 0; }
  a { color: var(--series-1); }
  footer { margin-top: 48px; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>ops-judge</h1>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <div class="toggles">
      <button class="tg" data-lang="en">EN</button>
      <button class="tg" data-lang="zh">中文</button>
      <button class="tg" id="theme" aria-label="toggle theme">◐</button>
    </div>
  </header>

  <div class="tiles" id="tiles"></div>

  <h2 data-i18n="h_how"></h2>
  <div class="card">
    <div class="pipeline" id="pipeline"></div>
    <p class="muted" style="margin:12px 0 0;font-size:13px" data-i18n="how_note"></p>
  </div>

  <h2 data-i18n="h_results"></h2>
  <div class="card">
    <p style="margin-top:0" data-i18n="results_q"></p>
    <table id="methods"></table>
    <p class="muted" style="font-size:13px;margin-bottom:0" data-i18n="results_note"></p>
  </div>

  <h2 data-i18n="h_exp"></h2>
  <div id="exp"></div>

  <h2 data-i18n="h_cases"></h2>
  <p class="muted" data-i18n="cases_note"></p>
  <div class="explorer">
    <div>
      <div class="filters" id="filters">
        <input id="q" type="search">
      </div>
      <div class="card list" id="list" role="listbox"></div>
    </div>
    <div class="card" id="detail"></div>
  </div>

  <h2 data-i18n="h_learned"></h2>
  <div class="card"><ul class="notes" id="learned"></ul></div>

  <footer data-i18n="footer"></footer>
</main>
<div id="tip"></div>

<script>
const DATA = /*__DATA__*/null;
const S = DATA.summary, CASES = DATA.cases;
const TRANSIENT = new Set(["flaky_test", "infrastructure", "rerun_fixes_it"]);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = (x) => x == null ? "—" : (x * 100).toFixed(1) + "%";
const f3 = (x) => x == null || Number.isNaN(x) ? "—" : x.toFixed(3);

    h_how: "How it works",

        ["Rule", "regex: disk full, spot reclaim, runner lost"], ["Decision model", "Kev-4B / Jev: typed answer + probabilities"],

    how_note: "Every tier returns a probability distribution; per-policy thresholds decide whether to stop or escalate. flaky_test needs 0.85 (it triggers an automatic rerun), unknown always escalates, fork PRs are never auto-rerun. Every decision is written to a SQLite audit log.",
    h_results: "Results",
    results_q: "Task: at the moment a job fails, predict whether a plain rerun will fix it. Ground truth comes from what actually happened on GitHub (attempt 1 failed → a later attempt passed or not).",

    results_note: "AUROC 0.5 = guessing (dashed line). Blue = models, gray = non-model baselines. “Calibrated” = accuracy after fixing “how sure” on known outcomes, checked on cases the fix never saw. ECE = calibration error, lower is better. Kev-4B ran on CPU here (the GPU was busy), so its latency is not comparable.",
    h_cases: "Case explorer",
    h_exp: "Improvements tried",
    x_sel: "1 · Answer only when sure", x_sel_p: "The model (LLM, all facts, calibrated) only answers when it is at least this sure; everything else goes to a person.",

    x_cal: "2 · Make “how sure” honest (calibration)", x_cal_p: "Calibration error: when a model says “80% sure”, how far is it from being right 80% of the time? Fixed with known answers, checked on cases the fix never saw (5-fold).",

    cases_note: "Every case is a real failed job. The decision is made from the facts below only; the outcome is revealed afterwards.",
    search: "Search error text, repo, job…",
    f_all: "All", f_wrong: "Cascade wrong", f_queued: "Sent to human", f_tr: "Rerun fixed it", f_pe: "Rerun did not help",

    facts: "Facts the judges see", excerpt: "Error excerpt", lines: "log lines →", excerpt_lines: "lines",
    per_model: "Every model on this case", cascade: "Cascade path", accept: "accept", escalate: "escalate", queued: "queued for review",
    decision: "Decision", action: "Action", correct: "matches outcome", wrong: "does not match outcome", waiting: "human decides",
    open_gh: "open on GitHub ↗", fork: "fork PR", transient_hint: "↻ = a rerun would fix it",
    h_learned: "What I learned",
    learned: [
      "<b>Label per job, not per run.</b> A run can keep failing because of one job while another job passed on rerun. Labelling by run mislabelled 20 cases; labelling by the job’s own last attempt fixed it, and every model’s score went up.",
      "<b>“Rerun passed” ≠ “flaky test”.</b> Many failures were AWS spot-instance reclaims (infrastructure). The question is really “transient vs persistent”, so that is what is scored.",
      "<b>Preprocessing decides the outcome.</b> Post-job cleanup output (sanitizer reports, cache saves) buried the real error; cutting at the failed step and preferring GitHub’s <code>##[error]</code> annotation shrank the excerpt from 121 to 46 lines.",

    h_how: "運作方式",
    p: [["GitHub Actions 失敗", "run＋失敗 job 的 log"], ["前處理", "截掉 cleanup 雜訊、取 ##[error] 標註、基礎設施／環境訊號"],

        ["規則", "regex：磁碟滿、Spot 回收、runner 斷線"], ["Decision model", "Kev-4B／Jev：固定型別的答案＋機率"],
        ["LLM", "只處理灰色地帶"], ["人工佇列", "仍不確定 → 人工審核，標註回收"], ["動作", "重跑・PR 留言・通知平台團隊"]],

    h_results: "結果",

      "<b>「重跑後通過」不等於「flaky test」。</b>很多失敗其實是 AWS Spot 機器被回收（基礎設施問題）。問題的本質是「暫時性 vs 持續性」，所以評分也照這個來。",
      "<b>前處理決定結果。</b>失敗之後的 cleanup 輸出把真正的錯誤擠掉了；在失敗步驟截斷、優先採用 GitHub 的 <code>##[error]</code> 標註後，錯誤段落從 121 行降到 46 行。",
      "<b>不洩漏答案。</b>重跑結果就是答案，所以絕不當輸入；歷史、其他分支、GitHub 故障都只看失敗之前的資料。",
      "<b>最大的進步來自「校準」。</b>用已知答案修正「幾成把握」（再用修正時沒看過的題目檢查），校準誤差從 0.18 降到 0.06，LLM 從 67 分變成 83 分；小模型 Kev-4B 也到 81 分。",
      "<b>有把握才回答：</b>把握 85% 以上時，LLM 回答了 48% 的失敗，答對 90%；其餘交給人。",
      "<b>有些點子沒用，也照實寫出來：</b>額外的線索（失敗測試的歷史、其他分支、GitHub 故障、修改的程式行）只讓 AUROC 從 0.72 變 0.73；把問題拆成兩個是非題，兩個模型都變差。",
      "<b>算成本之後，結論會變。</b>如果工程師查一次要 15 分鐘，「全部直接重跑」已經接近最佳，模型只省約 4%；查一次 5 分鐘時省約 12%。模型在失敗原因多元的專案（airflow、sveltejs/kit、ruff）最有幫助，在幾乎都是重跑就好的專案（deno、vue）則沒有加分。",
    ],
    footer: "資料：8 個專案的公開 GitHub Actions run：apache/airflow、denoland/deno、sveltejs/kit、vuejs/core、python/cpython、astral-sh/ruff、microsoft/TypeScript、huggingface/transformers（log 為 GitHub 公開內容）。由 scripts/build_site.py 產生。",
    tier: {rule: "規則", kev: "Kev-4B", llm: "LLM", human: "人工"},
  },
};
let lang = (navigator.language || "").startsWith("zh") ? "zh" : "en";
let filter = "all", selected = null;

function renderStatic() {
  const t = T[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#q").placeholder = t.search;

  const X = S.experiments;
  const bestCal = X ? Math.max(...Object.values(X.models).map((m) => m.calibrated.accuracy)) : null;
  const early = S.cascade.tiers.rule + S.cascade.tiers.kev;
  $("#tiles").innerHTML = [[S.n_raw + " → " + S.n, t.t_cases], [S.repos.length, t.t_repos], [pct(bestCal), `${t.t_best} ${X ? pct(X.majority.all) : "—"}`],
    [pct(early / S.n), t.t_cascade]].map(([v, k]) => `<div class="card tile"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");

  $("#pipeline").innerHTML = t.p.map(([a, b], i) => (i ? '<span class="arrow">→</span>' : "") +
    `<div class="stage"><b>${a}</b>${b}</div>`).join("");

  const rows = S.methods.map((m) => {
    const w = m.auroc == null ? 0 : m.auroc * 100;
    const bar = m.auroc == null ? `<span class="muted">—</span>` :
      `<div class="hbar" data-tip="${esc(m.name)}: AUROC ${f3(m.auroc)}"><div class="fill ${m.kind === "baseline" ? "base" : ""}" style="width:${w}%"></div><div class="chance" style="left:50%"></div></div>`;
    return `<tr><td>${esc(m.name)}${m.note ? `<div class="muted" style="font-size:12px">${esc(m.note)}</div>` : ""}</td>
      <td class="num">${pct(m.accuracy)}</td><td class="num">${m.accuracy_calibrated == null ? "—" : pct(m.accuracy_calibrated)}</td><td class="num">${f3(m.auroc)}</td><td class="barcell">${bar}</td>
      <td class="num">${m.ece == null ? "—" : f3(m.ece)}</td><td class="num">${m.latency_ms == null ? "—" : (m.latency_ms / 1000).toFixed(1) + " s"}</td></tr>`;
  }).join("");
  $("#methods").innerHTML = `<thead><tr><th>${t.m_method}</th><th class="num">${t.m_acc}</th><th class="num">${t.m_acc_cal}</th><th class="num">${t.m_auroc}</th><th></th><th class="num">${t.m_ece}</th><th class="num">${t.m_lat}</th></tr></thead><tbody>${rows}</tbody>`;

  const fs = [["all", t.f_all], ["wrong", t.f_wrong], ["queued", t.f_queued], ["transient", t.f_tr], ["persistent", t.f_pe]];
  $("#filters").querySelectorAll("button").forEach((b) => b.remove());
  fs.forEach(([k, label]) => {
    const n = CASES.filter((c) => match(c, k)).length;
    const b = document.createElement("button");
    b.className = "tg"; b.textContent = `${label} ${n}`; b.setAttribute("aria-pressed", filter === k);
    b.onclick = () => { filter = k; renderStatic(); renderList(); };
    $("#filters").appendChild(b);
  });
  $("#learned").innerHTML = t.learned.map((x) => `<li>${x}</li>`).join("");
  renderExperiments(); renderList(); renderDetail();
}

function renderExperiments() {
  const X = S.experiments, t = T[lang];
  if (!X) { $("#exp").innerHTML = ""; return; }
  const M = X.models, best = M.llm || Object.values(M)[0];
  const row = (cells) => `<tr>${cells.map((c, i) => `<td class="${i ? "num" : ""}">${c}</td>`).join("")}</tr>`;
  const head = (cells) => `<thead><tr>${cells.map((c, i) => `<th class="${i ? "num" : ""}">${c}</th>`).join("")}</tr></thead>`;
  const sel = best.selective.map((r) => row([Math.round(r.threshold * 100) + "%", `${r.answered} (${pct(r.coverage)})`, pct(r.accuracy)])).join("");
  const cal = Object.entries(M).map(([k, m]) => row([esc(k), f3(m.raw.ece), f3(m.calibrated.ece)])).join("");
  const cost = Object.entries(best.cost_sensitivity).map(([h, c]) => row([h, Math.round(c.always_human), Math.round(c.always_rerun), Math.round(c.model), Math.round(c.oracle)])).join("");
  const agree = Object.entries(X.agreement || {}).map(([k, v]) => row([esc(k), `${v.decided} (${pct(v.coverage)})`, pct(v.accuracy)])).join("");
  const repos = Object.entries(best.by_repo).map(([r, v]) => row([esc(r), v.n, pct(v.majority), pct(v.accuracy)])).join("");
  $("#exp").innerHTML = `<div class="expgrid">
    <div class="card"><h3>${t.x_sel}</h3><p>${t.x_sel_p}</p><table>${head([t.x_th, t.x_ans, t.x_acc])}<tbody>${sel}</tbody></table></div>
    <div class="card"><h3>${t.x_cal}</h3><p>${t.x_cal_p}</p><table>${head([t.x_model, t.x_before, t.x_after])}<tbody>${cal}</tbody></table></div>
    <div class="card"><h3>${t.x_cost}</h3><p>${t.x_cost_p}</p><table>${head([t.x_hc, t.x_human, t.x_rerun, t.x_ours, t.x_best])}<tbody>${cost}</tbody></table></div>
    ${agree ? `<div class="card"><h3>${t.x_agree}</h3><p>${t.x_agree_p}</p><table>${head([t.x_pair, t.x_dec, t.x_acc])}<tbody>${agree}</tbody></table></div>` : ""}
    <div class="card"><h3>${t.x_clean}</h3><p>${t.x_clean_p} (${X.n_clean}/${X.n})</p><table>${head([t.x_repo, t.x_n, t.x_base, t.x_acc])}<tbody>${repos}</tbody></table></div>
  </div>`;
}

function match(c, k) {
  return k === "all" || (k === "wrong" && c.correct === false) || (k === "queued" && c.final == null) || c.gold === k;
}

function verdictBadge(c) {
  const t = T[lang];
  if (c.final == null) return `<span class="badge wait"><span class="dot"></span>${t.waiting}</span>`;
  return c.correct ? `<span class="badge ok"><span class="dot"></span>✓ ${t.correct}</span>`
                   : `<span class="badge bad"><span class="dot"></span>✕ ${t.wrong}</span>`;
}

function miniBadge(c) {
  const t = T[lang];
  const [cls, icon, label] = c.final == null ? ["wait", "⋯", t.waiting] : c.correct ? ["ok", "✓", t.correct] : ["bad", "✕", t.wrong];
  return `<span class="badge ${cls}" title="${label}" aria-label="${label}"><span class="dot"></span>${icon}</span>`;
}

function renderList() {
  const q = $("#q").value.toLowerCase();
  const items = CASES.filter((c) => match(c, filter) &&
    (!q || (c.facts.first_error_line + " " + c.repo + " " + c.job + " " + c.excerpt).toLowerCase().includes(q)));
  if (!items.includes(selected)) selected = items[0] || null;
  $("#list").innerHTML = items.map((c, i) => `<div class="item" role="option" data-i="${CASES.indexOf(c)}" aria-selected="${c === selected}">
      <div style="display:flex;justify-content:space-between;gap:6px"><span><b>${esc(c.repo.split("/")[1])}</b> · ${esc(c.job.slice(0, 34))}</span>${miniBadge(c)}</div>
      <div class="err">${esc(c.facts.first_error_line || "—")}</div></div>`).join("");
  $("#list").querySelectorAll(".item").forEach((el) => el.onclick = () => { selected = CASES[+el.dataset.i]; renderList(); renderDetail(); });
}

function probRows(probs) {
  return Object.entries(probs).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    `<div class="prow" data-tip="${esc(k)}: ${v.toFixed(3)}"><span class="lab ${TRANSIENT.has(k) ? "tr" : ""}">${esc(k)}</span>
     <span class="track"><span class="fill" style="width:${(v * 100).toFixed(1)}%"></span></span><span class="val">${v.toFixed(2)}</span></div>`).join("");
}

function factValue(v) {
  if (Array.isArray(v)) return v.length ? esc(v.join(", ")) : '<span class="muted">—</span>';
  if (typeof v === "boolean") return v ? "true" : "false";
  return esc(v);
}

function renderDetail() {
  const c = selected, t = T[lang];
  if (!c) { $("#detail").innerHTML = ""; return; }
  const steps = c.path.map((p) => {
    const label = p.tier === "human" ? t.queued : `${esc(p.value)} · ${p.top.toFixed(2)} · ${p.accepted ? t.accept : t.escalate}`;
    return `<div class="step ${p.accepted && p.tier !== "human" ? "acc" : ""}"><div class="t">${t.tier[p.tier]}</div>${label}</div>`;
  }).join('<span class="arrow">→</span>');
  $("#detail").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><b>${esc(c.repo)}</b> · ${esc(c.job)} ${c.fork ? `<span class="badge">${t.fork}</span>` : ""}</div>
      <a href="${c.run_url}" target="_blank" rel="noopener">${t.open_gh}</a></div>
    <h3>${t.facts} <span class="muted" style="font-weight:400">(${c.log_lines} ${t.lines} ${c.excerpt.split("\n").length} ${t.excerpt_lines})</span></h3>
    <dl class="facts">${Object.entries(c.facts).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${factValue(v)}</dd>`).join("")}</dl>
    <details style="margin-top:10px"><summary>${t.excerpt}</summary><pre>${esc(c.excerpt)}</pre></details>
    <h3>${t.cascade}</h3><div class="path">${steps}</div>
    <div class="verdict"><b>${t.decision}:</b> ${c.final == null ? t.queued : `<b>${esc(c.final)}</b> (${t.tier[c.decided_by]})`}
      &nbsp;·&nbsp; <b>${t.action}:</b> ${esc(c.action.kind)}</div>
    <div class="verdict"><b>${t.outcome}:</b> ${c.gold === "transient" ? "↻ " + t.tr : t.pe} &nbsp; ${verdictBadge(c)}</div>
    <h3>${t.per_model} <span class="muted" style="font-weight:400">${t.transient_hint}</span></h3>
    <div class="models">${Object.entries(c.models).map(([name, m]) => `<div class="model"><div class="name">${esc(name)}</div>${probRows(m.probs)}</div>`).join("")}</div>`;
}

// Tooltip for every [data-tip] mark.
const tip = $("#tip");
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY + 14 + "px";
});
document.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => { lang = b.dataset.lang; renderStatic(); });
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
                                                       : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
$("#q").oninput = renderList;
renderStatic();
</script>
</body>
</html>
