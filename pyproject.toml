[project]
name = "ops-judge"
version = "0.1.0"
description = "Calibrated, auditable judgment layer (Jev -> LLM -> human) for CI failure triage and alert noise reduction"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "httpx>=0.27", "pyyaml>=6", "numpy>=1.26"]

[project.scripts]
ops-judge = "ops_judge.__main__:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
templates = ["drain3>=0.9"]
dev = ["pytest>=8", "matplotlib>=3.8", "drain3>=0.9"]

[tool.setuptools.packages.find]
include = ["judge_core*", "ops_judge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
